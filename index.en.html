<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noai, noimageai">
  <title>ALCAMPETTO 🏀 — Free basketball courts atlas in Milan</title>

  <!-- Shared stylesheet -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=20261111b">

  <!-- EXTERNAL DEPENDENCY: Leaflet
       Interactive map library. OpenStreetMap tiles. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       LIGHTBOX
       Fullscreen overlay: hero + Mondrian mosaic.
       Content built dynamically by alcampetto.js.
       ═══════════════════════════════════════════════════════ -->
  <div id="lightbox">
    <button id="lightbox-close">✕</button>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       HEADER
       ═══════════════════════════════════════════════════════ -->
  <header class="site-header">
    <div class="header-left">
      <a class="logo" href="index.en.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="38 46 375 120">
          <line x1="145.03" y1="101.5" x2="403.69" y2="101.5" stroke="#FF5F1F" stroke-width="3.3" opacity="0.25" stroke-linecap="round"/>
          <text x="50" y="130" font-family="'Bebas Neue', sans-serif" font-size="80" letter-spacing="3.2px" fill="#FF5F1F"><tspan>AL</tspan><tspan fill="none" stroke="none">C</tspan><tspan fill="#E8E8E8">AMPETTO</tspan></text>
          <path d="M 145.03,76.75 A 24.75,24.75 0 1,0 145.03,126.25" fill="none" stroke="#FF5F1F" stroke-width="5.5" stroke-linecap="round"/>
          <circle cx="145.03" cy="101.50" r="3.3" fill="#FF5F1F"/>
        </svg>
      </a>
      <div class="tagline">
        Atlas of Free basketball courts in Milan<br>
        <span id="progress-bar">[░░░░░░░░░░░░░░░░░░░░]</span> <span id="court-count">…</span> of ~<span id="court-total">…</span> · <span id="court-percent">…</span>%
      </div>
    </div>
    <div class="lang-switch">
      <a class="lang-btn" href="index.html"><span class="flag">🇮🇹</span> IT</a>
    </div>
  </header>


  <!-- ═══════════════════════════════════════════════════════
       VIEW TABS
       Switch between the internal views (cards, map, series);
       "Blog" is a link to another page.
       They sit right below the header: first pick the view,
       then refine it with the controls below.
       ═══════════════════════════════════════════════════════ -->
  <div class="view-tabs">
    <button class="view-tab active" data-view="grid">Cards</button>
    <button class="view-tab" data-view="map">Map</button>
    <button class="view-tab" data-view="serie">Series</button>
    <a class="view-tab" href="blog/">Blog <span class="view-tab-arrow" aria-hidden="true">↗</span></a>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       CONTROLS BAR
       Search, filters and sorting: they act on every view
       (cards, map, series).
       ═══════════════════════════════════════════════════════ -->
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="search" id="search" placeholder="Search by name, area, address…" autofocus>
    </div>
    <!-- Toggles: one click turns the filter on, a second click
         turns it off. Active filters add up (alcampetto.js). -->
    <div class="filter-group">
      <button class="filter-btn" data-filter="lit" aria-pressed="false">Lit</button>
      <button class="filter-btn" data-filter="three_pt_line" aria-pressed="false">Three-pt line</button>
      <button class="filter-btn" data-filter="fenced" aria-pressed="false">Fenced</button>
    </div>
    <div class="sort-group">
      <span class="sort-label">Sort</span>
      <button class="sort-btn active" data-sort="id">By #ID</button>
      <button class="sort-btn" data-sort="date">Most recent</button>
      <!-- visible only in the Color series (managed by alcampetto.js) -->
      <button class="sort-btn" data-sort="tinta" id="sort-tinta" hidden>By hue</button>
    </div>
    <!-- Shown only with an active filter or a search text
         (hidden attribute managed by alcampetto.js) -->
    <div class="count-label" id="count-label" hidden>
      <span><strong id="count">—</strong> of <span id="count-total">—</span> courts</span>
      <button class="reset-btn" id="filters-reset">Clear <span aria-hidden="true">✕</span></button>
    </div>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       MAP
       Leaflet container, hidden by default.
       Activated by the "Map" tab.
       ═══════════════════════════════════════════════════════ -->
  <div id="map"></div>


  <!-- ═══════════════════════════════════════════════════════
       SERIES VIEW
       Comparative grid: photos of the same type side by side,
       one cell per court. Hidden by default, activated by the
       "Series" tab. The selector buttons are generated by
       alcampetto.js from the SERIES configuration.
       ═══════════════════════════════════════════════════════ -->
  <div class="serie-bar" id="serie-bar">
    <span class="serie-label">Series</span>
    <div class="serie-select" id="serie-select"></div>
    <span class="serie-count" id="serie-count"></span>
  </div>
  <div id="serie"></div>


  <!-- ═══════════════════════════════════════════════════════
       COURT GRID
       Cards are generated by alcampetto.js after
       alcampetto.json is loaded.
       ═══════════════════════════════════════════════════════ -->
  <main id="grid">
    <div class="state-msg">Loading data…</div>
  </main>


  <!-- ═══════════════════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════════════════ -->
  <footer class="site-footer">
    <div class="footer-meta">
      Licenses: <a href="https://eupl.eu" target="_blank" rel="noopener">EUPL-1.2</a> for code, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> for data, <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank" rel="noopener">CC BY-NC-ND 4.0</a> for photos and audio files.<br>
      Contribute on <a href="https://github.com/photogabe/alcampetto" target="_blank" rel="noopener">GitHub</a> ·
      <a href="about.en.html">About</a>
    </div>
    <div class="footer-actions">
      <!-- Preference for the pin link on the cards: set once and
           remembered by the browser (alcampetto.js). -->
      <div class="maps-choice">
        <span class="maps-choice-label">Open maps with</span>
        <button class="provider-btn active" data-provider="google">Google Maps</button>
        <button class="provider-btn" data-provider="osm">OSM</button>
      </div>
      <a class="json-btn" href="alcampetto.json" target="_blank" download>
        ⬇ Download alcampetto.json
      </a>
    </div>
  </footer>


  <!-- EXTERNAL DEPENDENCY: Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>

  <!-- Shared JavaScript — included after the DOM so it can
       find all HTML elements it needs to manage. -->
  <script src="alcampetto.js?v=20261111"></script>

</body>
</html>
